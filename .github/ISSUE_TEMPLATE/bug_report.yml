name: Report a setup problem
description: Report installer or Lubuntu compatibility problems with redacted diagnostics.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Lubuntu/Ubuntu version, CPU architecture, desktop, X11/Wayland, Rust version, uv version, and Codex version.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Include the command and a redacted error. Exclude credentials, private screenshots, raw window titles, and personal configuration.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a disposable desktop or test application where possible.
